<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
<defs>
  <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#252a31"/><stop offset="1" stop-color="#14171c"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#56c8ff" stop-opacity=".15"/><stop offset=".3" stop-color="#56c8ff" stop-opacity=".25"/><stop offset=".43" stop-color="#58caff"/><stop offset=".5" stop-color="#e7f8ff"/><stop offset=".57" stop-color="#39aaff"/><stop offset=".72" stop-color="#56c8ff" stop-opacity=".25"/><stop offset="1" stop-color="#56c8ff" stop-opacity=".15"/></linearGradient>
  <filter id="glow" x="-20%" y="-30%" width="140%" height="170%"><feGaussianBlur stdDeviation="8" result="blur"/><feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.12 0 0 0 0 0.57 0 0 0 0 1 0 0 0 .5 0"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-20%" y="-30%" width="140%" height="170%"><feGaussianBlur stdDeviation="3"/></filter>
  <linearGradient id="fox" x2="0" y2="1"><stop stop-color="#ffb354"/><stop offset="1" stop-color="#ee7c23"/></linearGradient>
</defs>
<rect width="1200" height="560" fill="url(#bg)"/>
<!-- understated desktop menu bar -->
<rect width="1200" height="36" fill="#1c2026" opacity=".94"/>
<g fill="#e7e9ec" opacity=".78" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="14">
 <text x="28" y="24" font-weight="700">◉</text><text x="62" y="24">Finder</text><text x="118" y="24">File</text><text x="154" y="24">Edit</text><text x="196" y="24">View</text><text x="246" y="24">Window</text><text x="318" y="24">Help</text>
 <text x="1020" y="24">Wi-Fi</text><text x="1082" y="24">100%</text><text x="1130" y="24">10:42</text>
</g>
<!-- the black notch/island, with a thin cool edge -->
<path d="M374 0 H826 V114 C826 145 802 168 770 168 H430 C398 168 374 145 374 114 Z" fill="#030405"/>
<path d="M374 0 H826 V114 C826 145 802 168 770 168 H430 C398 168 374 145 374 114 Z" fill="none" stroke="#168bce" stroke-opacity=".15" stroke-width="1.1"/>
<path d="M374 0 H826 V114 C826 145 802 168 770 168 H430 C398 168 374 145 374 114 Z" fill="none" stroke="url(#edge)" stroke-width="1.8" stroke-linecap="round" filter="url(#glow)"/>
<!-- small NEO fox icon to show the existing pet remains in place -->
<g transform="translate(599 74)">
 <path d="M-22 2 L-27-20 L-8-12 Q0-17 8-12 L27-20 L22 2 Q24 17 0 27 Q-24 17-22 2Z" fill="url(#fox)"/>
 <path d="M-16-10 L-21-16 L-12-12 M16-10 L21-16 L12-12" fill="none" stroke="#ffe0a8" stroke-width="2" stroke-linecap="round"/>
 <ellipse cx="-8" cy="1" rx="2.2" ry="3" fill="#21150d"/><ellipse cx="8" cy="1" rx="2.2" ry="3" fill="#21150d"/>
 <path d="M-3 9 Q0 12 3 9" fill="none" stroke="#5b2b15" stroke-width="1.8" stroke-linecap="round"/>
</g>
<text x="600" y="203" text-anchor="middle" fill="#dce2e9" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="16" opacity=".82">Listening cue: a quiet blue highlight travels around the notch edge</text>
<text x="600" y="232" text-anchor="middle" fill="#aab4c0" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="13" opacity=".72">The bright segment moves slowly; the outline fades when NEO stops listening.</text>
</svg>